<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ самбар</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
}

table{
    border-collapse: collapse;
    width:100%;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:left;
}

th{
    background:#f2f2f2;
}

button{
    padding:5px 10px;
    cursor:pointer;
}

.delete-btn{
    background:red;
    color:white;
    border:none;
}

h1{
    color:#333;
}
</style>
</head>
<body>

<script>
const password = prompt("Админ нууц үг:");

if(password !== "1234"){
    document.body.innerHTML = "<h2>Хандах эрхгүй</h2>";
    throw new Error("Access denied");
}
</script>

<h1>Админ самбар</h1>

<button onclick="location.reload()">Шинэчлэх</button>
<button onclick="downloadCSV()">
    CSV татах
</button>
<br><br>

<table>
    <thead>
        <tr>
            <th>№</th>
            <th>Нэр</th>
            <th>Утас</th>
            <th>Үйлдэл</th>
        </tr>
    </thead>

    <tbody id="tableBody"></tbody>
</table>

<script type="module">
let allData = {};
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    remove
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB1EYa0UH8PQMid5CEHjS2sR1ZM5kD1DN0",
  authDomain: "mong-123.firebaseapp.com",
  databaseURL: "https://mong-123-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mong-123",
  storageBucket: "mong-123.firebasestorage.app",
  messagingSenderId: "971498618179",
  appId: "1:971498618179:web:0df6ee78265156c85743f6"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.deleteUser = function(id){

    if(confirm("Энэ хэрэглэгчийг устгах уу?")){
        remove(ref(db, "users/" + id));
    }

}
window.downloadCSV = function () {

    let csv = "Нэр,Утас\n";

    for (const id in allData) {
        csv += `${allData[id].name},${allData[id].phone}\n`;
    }

    const blob = new Blob(
        ["\uFEFF" + csv],
        { type: "text/csv;charset=utf-8;" }
    );

    const link = document.createElement("a");

    link.href = URL.createObjectURL(blob);
    link.download = "users.csv";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
    
onValue(ref(db, "users"), (snapshot) => {
    allData = data || {};
    const data = snapshot.val();
    const tableBody = document.getElementById("tableBody");

    tableBody.innerHTML = "";

    if(!data){
        tableBody.innerHTML =
        "<tr><td colspan='4'>Бүртгэл алга</td></tr>";
        return;
    }

    let no = 1;

    for(const id in data){

        tableBody.innerHTML += `
        <tr>
            <td>${no++}</td>
            <td>${data[id].name}</td>
            <td>${data[id].phone}</td>
            <td>
                <button
                 class="delete-btn"
                 onclick="deleteUser('${id}')">
                 Устгах
                </button>
            </td>
        </tr>
        `;
    }

});

</script>

</body>
</html>
